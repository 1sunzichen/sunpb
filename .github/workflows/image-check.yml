name: Check image and payment module
on:
  push:
    paths: ['apps/image/**', '.github/workflows/image-check.yml']
  pull_request:
    paths: ['apps/image/**', '.github/workflows/image-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
